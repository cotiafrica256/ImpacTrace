name: Build ImpacTrace APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'flutter.impactrace/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter.impactrace
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name impactrace .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://your-railway-api.example.com/api' }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: impactrace-release-apk
          path: flutter.impactrace/build/app/outputs/flutter-apk/app-release.apk
